# Compares a PR's performance with its base, on demand: add the `benchmark`
# label to the PR, or run this workflow by hand for any branch. Base and head
# are measured on the same runner, interleaved, with Apollo's InMemoryCache as
# the noise control (scripts/bench/). The result is posted to the PR by
# benchmark-comment.yml, so this workflow never holds a write token.
name: Benchmark

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      base:
        description: Branch or commit to compare against (the merge base with it is used)
        required: true
        default: main
      pr:
        description: PR number to post the result on (optional)
        required: false

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'benchmark'
    name: Measure sections ${{ matrix.sections }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      # Balanced by measured time. Each job measures all four configurations of
      # its sections on its own runner, so every comparison stays on one machine.
      matrix:
        sections: ["7", "6", "5,12,3,4,8,13", "1,2,9,10,11,14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          fetch-depth: 0
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: Measure base vs head
        env:
          BASE: ${{ github.event.pull_request.base.sha || inputs.base }}
          SECTIONS: ${{ matrix.sections }}
        run: |
          base_commit=$(git rev-parse --verify --quiet "origin/$BASE^{commit}" || git rev-parse --verify "$BASE^{commit}")
          node scripts/bench/pr.mjs --base "$(git merge-base "$base_commit" HEAD)" \
            --sections="$SECTIONS" --runs=5 --out bench-result.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-result-${{ strategy.job-index }}
          path: bench-result.json

  report:
    needs: measure
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bench-result-*
          path: results

      - name: Write the report
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir comment
          node scripts/bench/report.mjs results/*/bench-result.json --out comment/comment.md --run-url "$RUN_URL"
          cat comment/comment.md >> "$GITHUB_STEP_SUMMARY"
          jq -n --arg pr "$PR" --arg sha "$HEAD_SHA" \
            '{kind: "results", pr: ($pr | if . == "" then null else tonumber end), headSha: $sha}' \
            > comment/comment-meta.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-comment
          path: comment/
