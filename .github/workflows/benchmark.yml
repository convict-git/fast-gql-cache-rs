# Compares a PR's performance with its base while the PR carries the
# `benchmark` label (on labelling and on every push), or on demand for any
# branch. Base and head are measured on the same runner, interleaved, with
# Apollo's InMemoryCache as the noise control (scripts/bench/). The result is
# posted to the PR by benchmark-comment.yml, so this workflow never holds a
# write token.
#
# The `Benchmark gate` job runs on every PR event and is a required check on
# main: it passes when the PR has no `benchmark` label, and otherwise only once
# a benchmark of the PR's current commit has succeeded.
name: Benchmark

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      base:
        description: Branch or commit to compare against (the merge base with it is used)
        required: true
        default: main
      pr:
        description: PR number to post the result on (optional)
        required: false

permissions:
  contents: read

# A new push, or adding/removing the `benchmark` label, supersedes a running
# benchmark of the PR. Changes to other labels get a group of their own, so
# they never cancel one.
concurrency:
  group: >-
    ${{ github.event_name == 'pull_request'
        && (!contains(fromJSON('["labeled", "unlabeled"]'), github.event.action)
            || github.event.label.name == 'benchmark')
        && format('benchmark-pr-{0}', github.event.pull_request.number)
        || format('benchmark-run-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  measure:
    if: >-
      github.event_name == 'workflow_dispatch'
      || (contains(github.event.pull_request.labels.*.name, 'benchmark')
          && (contains(fromJSON('["opened", "synchronize", "reopened"]'), github.event.action)
              || (github.event.action == 'labeled' && github.event.label.name == 'benchmark')))
    name: Measure sections ${{ matrix.sections }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      # Balanced by measured time. Each job measures all four configurations of
      # its sections on its own runner, so every comparison stays on one machine.
      matrix:
        sections: ["7", "6", "5,12,3,4,8,13", "1,2,9,10,11,14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          fetch-depth: 0
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: Measure base vs head
        env:
          BASE: ${{ github.event.pull_request.base.sha || inputs.base }}
          SECTIONS: ${{ matrix.sections }}
        run: |
          base_commit=$(git rev-parse --verify --quiet "origin/$BASE^{commit}" || git rev-parse --verify "$BASE^{commit}")
          node scripts/bench/pr.mjs --base "$(git merge-base "$base_commit" HEAD)" \
            --sections="$SECTIONS" --runs=7 --out bench-result.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-result-${{ strategy.job-index }}
          path: bench-result.json

  report:
    needs: measure
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bench-result-*
          path: results

      - name: Write the report
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir comment
          node scripts/bench/report.mjs results/*/bench-result.json --out comment/comment.md --run-url "$RUN_URL"
          cat comment/comment.md >> "$GITHUB_STEP_SUMMARY"
          jq -n --arg pr "$PR" --arg sha "$HEAD_SHA" \
            '{kind: "results", pr: ($pr | if . == "" then null else tonumber end), headSha: $sha}' \
            > comment/comment-meta.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-comment
          path: comment/

  # Evaluated at the start of every run, so an earlier success on this commit
  # never stands in for a benchmark that has just started, and again at the
  # end of a run that measures (gate-final). scripts/bench/gate.mjs decides.
  gate:
    name: Benchmark gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: node scripts/bench/gate.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          # The `measure` job's condition (keep the two in sync).
          MEASURES: >-
            ${{ github.event_name == 'workflow_dispatch'
              || (contains(github.event.pull_request.labels.*.name, 'benchmark')
                  && (contains(fromJSON('["opened", "synchronize", "reopened"]'), github.event.action)
                      || (github.event.action == 'labeled' && github.event.label.name == 'benchmark'))) }}

  gate-final:
    name: Benchmark gate
    needs: [measure, report]
    if: always() && github.event_name == 'pull_request' && needs.measure.result != 'skipped'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: node scripts/bench/gate.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          # The `measure` job's condition (keep the two in sync).
          MEASURES: >-
            ${{ github.event_name == 'workflow_dispatch'
              || (contains(github.event.pull_request.labels.*.name, 'benchmark')
                  && (contains(fromJSON('["opened", "synchronize", "reopened"]'), github.event.action)
                      || (github.event.action == 'labeled' && github.event.label.name == 'benchmark'))) }}
