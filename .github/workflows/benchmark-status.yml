# On every PR push and label change, lets benchmark-comment.yml update the PR's
# benchmark comment ("not benchmarked" / "results are stale") and its
# `Benchmark gate` status. Runs no PR code.
name: Benchmark status

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions: {}

jobs:
  status:
    runs-on: ubuntu-24.04
    steps:
      - env:
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir comment
          jq -n --argjson pr "$PR" --arg sha "$HEAD_SHA" \
            '{kind: "status", pr: $pr, headSha: $sha}' > comment/comment-meta.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-comment
          path: comment/
