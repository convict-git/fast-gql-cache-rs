# Posts the benchmark comment and sets the required `Benchmark gate` status.
# Triggered by the runs of benchmark.yml and benchmark-status.yml, it runs this
# default-branch workflow with a write token and treats their artifact as data
# (scripts/bench/comment.mjs verifies the PR number before using it). This is
# GitHub's recommended split for PRs from forks.
name: Benchmark comment

on:
  workflow_run:
    workflows: [Benchmark, Benchmark status]
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write
  statuses: write

jobs:
  comment:
    # Runs for failed runs too: a failed benchmark still sets the gate (its
    # missing report artifact just means no comment).
    if: github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - id: artifact
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: benchmark-comment
          path: comment
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - if: steps.artifact.outcome == 'success'
        run: node scripts/bench/comment.mjs comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}

      # Independent of the artifact (a failed benchmark leaves none): the PRs
      # come from the API, for the commit GitHub reports the run was for.
      - name: Set the Benchmark gate status
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          TARGET_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -o pipefail
          gh api "repos/$REPO/commits/$SHA/pulls" --jq '.[] | select(.state == "open") | "\(.number) \(.head.sha)"' |
            while read -r pr head; do
              if [ "$head" = "$SHA" ]; then PR=$pr node scripts/bench/gate.mjs; fi
            done
